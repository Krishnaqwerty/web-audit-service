version: '3.8'

services:
  web-audit-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-audit-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      - VIRTUAL_THREADS_ENABLED=true
      - HTTP_CONNECT_TIMEOUT_MS=3000
      - HTTP_READ_TIMEOUT_MS=5000
      - CACHE_MAX_SIZE=20000
      - CACHE_TTL_MINUTES=30
      - RATE_LIMIT_RPM=100
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
